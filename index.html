<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Una Galaxia de Amor</title>
  <style>
    body {
        margin: 0;
        overflow: hidden;
        background-color: #020005;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #fff;
    }
    canvas { display: block; }
</style>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
</script>
</head>
<body>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. SCENE SETUP
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2500);
    
    const targetCameraY = 13;
    const targetCameraZ = 52;
    camera.position.set(0, targetCameraY, 550); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.8;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.04;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.2;
    controls.enabled = false;

    // Canvas Texture
    function createGlowTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(0.3, 'rgba(255, 60, 190, 0.85)');
        gradient.addColorStop(0.7, 'rgba(210, 10, 130, 0.3)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvas);
    }

    function createGasTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        gradient.addColorStop(0, 'rgba(255, 100, 200, 0.4)');
        gradient.addColorStop(0.5, 'rgba(180, 20, 140, 0.15)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 128, 128);
        return new THREE.CanvasTexture(canvas);
    }

    const particleTexture = createGlowTexture();
    const gasTexture = createGasTexture();

    // 2. SPACE TRAVEL STARS
    const travelStarCount = 2500;
    const travelStarGeo = new THREE.BufferGeometry();
    const travelStarPos = new Float32Array(travelStarCount * 3);

    for (let i = 0; i < travelStarCount; i++) {
        travelStarPos[i * 3]     = (Math.random() - 0.5) * 400;
        travelStarPos[i * 3 + 1] = (Math.random() - 0.5) * 300 + targetCameraY;
        travelStarPos[i * 3 + 2] = Math.random() * 600 - 50; 
    }

    travelStarGeo.setAttribute('position', new THREE.BufferAttribute(travelStarPos, 3));
    const travelStarMat = new THREE.PointsMaterial({
        size: 1.5,
        map: particleTexture,
        color: 0xffaae5,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const travelStarMesh = new THREE.Points(travelStarGeo, travelStarMat);
    scene.add(travelStarMesh);

    // 3. BLACK HOLE
    const bhGeo = new THREE.SphereGeometry(1.6, 64, 64);
    const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const blackHole = new THREE.Mesh(bhGeo, bhMat);
    scene.add(blackHole);

    // วงแหวนละอองดาวเรืองแสงสีชมพูรอบหลุมดำ
    const innerGlowCount = 1500;
    const innerGlowGeo = new THREE.BufferGeometry();
    const innerGlowPos = new Float32Array(innerGlowCount * 3);

    for(let i=0; i<innerGlowCount; i++) {
        const r = 1.62 + Math.random() * 0.8;
        const angle = Math.random() * Math.PI * 2;
        innerGlowPos[i*3] = Math.cos(angle) * r;
        innerGlowPos[i*3+1] = (Math.random() - 0.5) * 0.05;
        innerGlowPos[i*3+2] = Math.sin(angle) * r;
    }
    innerGlowGeo.setAttribute('position', new THREE.BufferAttribute(innerGlowPos, 3));
    const innerGlowMat = new THREE.PointsMaterial({
        size: 0.5,
        map: particleTexture,
        color: 0xff33bb,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });
    const innerGlowMesh = new THREE.Points(innerGlowGeo, innerGlowMat);
    scene.add(innerGlowMesh);

    // 4. NEBULA GAS CLOUD
    const gasCount = 800;
    const gasGeo = new THREE.PlaneGeometry(3.0, 3.0);
    const gasMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uTexture: { value: gasTexture }
        },
        vertexShader: `
            uniform float uTime;
            varying vec3 vColor;
            varying vec2 vUv;
            void main() {
                vUv = uv;
                vec4 instPos = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
                vec3 pos = instPos.xyz;
                
                float r = length(pos.xz);
                float angle = uTime * (2.5 / (r + 2.0)) + (40.0 - r) * 0.05;
                float c = cos(angle);
                float s = sin(angle);
                mat3 rotY = mat3(c, 0, s, 0, 1, 0, -s, 0, c);
                
                vec3 rotatedPos = rotY * pos;

                vec3 pinkGas = vec3(0.9, 0.2, 0.6);
                vec3 purpleGas = vec3(0.4, 0.05, 0.5);
                vec3 color = mix(pinkGas, purpleGas, smoothstep(3.0, 25.0, r));

                vColor = color * 1.2;

                vec4 mvPosition = viewMatrix * vec4(rotatedPos, 1.0);
                mvPosition.xy += position.xy * (1.0 + r * 0.06);
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            uniform sampler2D uTexture;
            varying vec3 vColor;
            varying vec2 vUv;
            void main() {
                vec4 tex = texture2D(uTexture, vUv);
                gl_FragColor = vec4(vColor * tex.rgb, tex.a * 0.25);
            }
        `,
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    });

    const gasMesh = new THREE.InstancedMesh(gasGeo, gasMat, gasCount);
    const dummyGas = new THREE.Object3D();
    for (let i = 0; i < gasCount; i++) {
        const r = 2.0 + Math.pow(Math.random(), 1.2) * 32;
        const angle = Math.random() * Math.PI * 2;
        const x = Math.cos(angle) * r + (Math.random() - 0.5) * 3.0;
        const z = Math.sin(angle) * r + (Math.random() - 0.5) * 3.0;
        const y = (Math.random() - 0.5) * 1.0;

        dummyGas.position.set(x, y, z);
        dummyGas.rotation.z = Math.random() * Math.PI;
        dummyGas.updateMatrix();
        gasMesh.setMatrixAt(i, dummyGas.matrix);
    }
    scene.add(gasMesh);

    // 5. ACCRETION GALAXY DISK
    const diskCount = 20000;
    const particleGeo = new THREE.PlaneGeometry(0.4, 0.4);
    
    const diskMat = new THREE.ShaderMaterial({
        uniforms: { 
            uTime: { value: 0 },
            uTexture: { value: particleTexture }
        },
        vertexShader: `
            uniform float uTime;
            varying vec3 vColor;
            varying vec2 vUv;
            
            void main() {
                vUv = uv;
                vec4 instPos = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
                vec3 pos = instPos.xyz;
                
                float r = length(pos.xz);
                float angle = uTime * (6.0 / (r + 1.0)) + (50.0 - r) * 0.08;
                float c = cos(angle);
                float s = sin(angle);
                mat3 rotY = mat3(c, 0, s, 0, 1, 0, -s, 0, c);
                
                vec3 rotatedPos = rotY * pos;

                vec3 innerPink = vec3(1.0, 0.35, 0.85);
                vec3 hotPink   = vec3(0.9, 0.1, 0.55);
                vec3 deepViolet= vec3(0.4, 0.02, 0.45);

                vec3 color = mix(innerPink, hotPink, smoothstep(1.8, 10.0, r));
                color = mix(color, deepViolet, smoothstep(10.0, 36.0, r));

                vColor = color * 1.8;

                vec4 mvPosition = viewMatrix * vec4(rotatedPos, 1.0);
                mvPosition.xy += position.xy * (0.12 + r * 0.01);
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            uniform sampler2D uTexture;
            varying vec3 vColor;
            varying vec2 vUv;
            void main() {
                vec4 tex = texture2D(uTexture, vUv);
                gl_FragColor = vec4(vColor * tex.rgb, tex.a * 0.75);
            }
        `,
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    });

    const diskMesh = new THREE.InstancedMesh(particleGeo, diskMat, diskCount);
    const dummy = new THREE.Object3D();

    const branches = 4;
    for (let i = 0; i < diskCount; i++) {
        const r = 1.8 + Math.pow(Math.random(), 1.3) * 36;
        const spinAngle = r * 0.28;
        const branchAngle = ((i % branches) * 2 * Math.PI) / branches;

        const randomX = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * (r * 0.22);
        const randomZ = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * (r * 0.22);

        const x = Math.cos(branchAngle + spinAngle) * r + randomX;
        const z = Math.sin(branchAngle + spinAngle) * r + randomZ;
        const y = (Math.random() - 0.5) * 0.35;

        dummy.position.set(x, y, z);
        dummy.updateMatrix();
        diskMesh.setMatrixAt(i, dummy.matrix);
    }
    scene.add(diskMesh);

    // 6. ANIMATION & TRAVEL CONTROLLER
    const clock = new THREE.Clock();
    let isTravelPhase = true;

    function animate() {
        const time = clock.getElapsedTime();
        
        if (isTravelPhase) {
            camera.position.z += (targetCameraZ - camera.position.z) * 0.025;

            if (Math.abs(camera.position.z - targetCameraZ) < 2) {
                camera.position.set(0, targetCameraY, targetCameraZ);
                isTravelPhase = false;
                controls.enabled = true;

                let fadeOpacity = 0.9;
                const fadeInterval = setInterval(() => {
                    fadeOpacity -= 0.05;
                    travelStarMat.opacity = Math.max(0, fadeOpacity);
                    if (fadeOpacity <= 0) {
                        scene.remove(travelStarMesh);
                        clearInterval(fadeInterval);
                    }
                }, 30);
            }
        }

        innerGlowMesh.rotation.y = -time * 0.8;
        diskMat.uniforms.uTime.value = time;
        gasMat.uniforms.uTime.value = time;

        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
