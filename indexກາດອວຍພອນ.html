<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ກາດອວຍພອນສຸດມ່ວນ & ສຸດພິເສດ 🎉💌</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap');

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        overflow: hidden;
        background-color: #0d021a;
        font-family: 'Noto Sans Lao', sans-serif;
        color: #fff;
        height: 100vh;
        width: 100vw;
    }

    #music-control {
        position: fixed;
        top: 15px;
        right: 15px;
        z-index: 100;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: #fff;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.3rem;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* ---------------- 1. ໜ້າຊອງກາດ ---------------- */
    #envelope-screen {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle, #3a084a 0%, #0d021a 100%);
        transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #envelope-screen.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    .envelope-wrapper {
        position: relative;
        cursor: pointer;
        text-align: center;
    }

    .envelope {
        width: 290px;
        height: 195px;
        background: linear-gradient(135deg, #ff4081, #ff1744);
        border-radius: 16px;
        position: relative;
        box-shadow: 0 15px 35px rgba(255, 23, 68, 0.5), 0 0 25px rgba(255, 255, 255, 0.3);
        display: flex;
        justify-content: center;
        align-items: center;
        border: 2px solid #ff80ab;
        animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.03); }
    }

    .envelope::before {
        content: '';
        position: absolute;
        top: 0;
        width: 0;
        height: 0;
        border-left: 145px solid transparent;
        border-right: 145px solid transparent;
        border-top: 105px solid #d50000;
        transform-origin: top;
        transition: transform 0.5s ease;
    }

    .envelope-wrapper:hover .envelope::before {
        transform: rotateX(40deg);
    }

    .heart-seal {
        font-size: 3.5rem;
        z-index: 2;
        filter: drop-shadow(0 5px 10px rgba(0,0,0,0.4));
        animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.2) rotate(5deg); }
        100% { transform: scale(1); }
    }

    .open-btn-text {
        margin-top: 35px;
        font-size: 1.3rem;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(90deg, #ff4081, #7c4dff);
        padding: 14px 32px;
        border-radius: 50px;
        box-shadow: 0 0 20px rgba(255, 64, 129, 0.6);
        border: 2px solid #ffffff;
        letter-spacing: 1px;
    }

    /* ---------------- 2. ໜ້າກາດ 3D ---------------- */
    #card-screen {
        position: absolute;
        inset: 0;
        z-index: 10;
        opacity: 0;
        transition: opacity 1s ease 0.2s;
        pointer-events: none;
    }

    #card-screen.show {
        opacity: 1;
        pointer-events: auto;
    }

    canvas { display: block; }

    #overlay-text {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 30px 20px 25px 20px;
        z-index: 15;
    }

    .header-msg {
        text-align: center;
        margin-top: 10px;
    }

    .title {
        font-size: 2.2rem;
        font-weight: 700;
        color: #ff4081;
        text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
        animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
        from { text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055; }
        to { text-shadow: 0 0 20px #ff4081, 0 0 35px #ff4081, 0 0 50px #ff4081; }
    }

    .subtitle {
        margin-top: 15px;
        font-size: 1.1rem;
        color: #ffffff;
        background: rgba(255, 0, 128, 0.3);
        padding: 12px 25px;
        border-radius: 20px;
        border: 1.5px solid rgba(255, 128, 171, 0.8);
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(255, 0, 128, 0.3);
        max-width: 90vw;
        line-height: 1.6;
    }

    .interactive-btns {
        pointer-events: auto;
        display: flex;
        gap: 12px;
        margin-bottom: 10px;
    }

    .fun-btn {
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        font-family: 'Noto Sans Lao', sans-serif;
        color: #fff;
        background: linear-gradient(45deg, #ff1744, #ff4081);
        border: none;
        padding: 10px 22px;
        border-radius: 30px;
        box-shadow: 0 4px 15px rgba(255, 23, 68, 0.4);
        transition: transform 0.2s;
    }

    .fun-btn:active { transform: scale(0.92); }

    .close-btn {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .floating-heart {
        position: absolute;
        pointer-events: none;
        font-size: 1.8rem;
        animation: floatUp 2s ease-out forwards;
        z-index: 99;
    }

    @keyframes floatUp {
        0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 1; }
        100% { transform: translateY(-120px) scale(1.4) rotate(20deg); opacity: 0; }
    }
  </style>

  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
      {
          "imports": {
              "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
              "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
          }
      }
  </script>
</head>
<body>

  <div id="music-control">🎵</div>

  <!-- ດຶງໄຟລ໌ music.mp3 ທີ່ອັບໂຫຼດເທິງ GitHub -->
  <audio id="bg-music" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div id="envelope-screen">
    <div class="envelope-wrapper" id="open-btn">
      <div class="envelope">
        <div class="heart-seal">💖</div>
      </div>
      <div class="open-btn-text">ກົດເພື່ອເປີດກາດອວຍພອນ 💌</div>
    </div>
  </div>

  <div id="card-screen">
    <div id="overlay-text">
      <div class="header-msg">
        <div class="title">🎉 ເຮັດໃຫ້ຄົນພິເສດ! ❤️</div>
        <div class="subtitle">
          ຂໍໃຫ້ມີຄວາມສຸກມາກໆ ມີລອຍຍິ້ມທີ່ສົດໃສໃນທຸກໆ ວັນ <br>
          ແລ້ວຢູ່ດ້ວຍກັນໄປນານໆນະມາລີຟາຍຍ! 🌹✨🎉
        </div>
      </div>

      <div class="interactive-btns">
        <button class="fun-btn" id="love-btn">❤️ ສົ່ງຄວາມຮັກ</button>
        <button class="fun-btn close-btn" id="close-btn">↩ ປິດກາດ</button>
      </div>
    </div>
  </div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const envelopeScreen = document.getElementById('envelope-screen');
    const cardScreen = document.getElementById('card-screen');
    const openBtn = document.getElementById('open-btn');
    const closeBtn = document.getElementById('close-btn');
    const loveBtn = document.getElementById('love-btn');
    const bgMusic = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-control');

    let isPlaying = false;

    function playAudio() {
        if (!bgMusic) return;
        bgMusic.play().then(() => {
            isPlaying = true;
            musicBtn.innerText = "🔊";
        }).catch(err => {
            console.log("Audio play failed:", err);
            isPlaying = false;
            musicBtn.innerText = "🔇";
        });
    }

    musicBtn.addEventListener('click', () => {
        if (isPlaying) {
            bgMusic.pause();
            isPlaying = false;
            musicBtn.innerText = "🔇";
        } else {
            playAudio();
        }
    });

    function createHeart(x, y) {
        const hearts = ['💖', '❤️', '💕', '✨', '🌸', '🎉'];
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = `${x - 15}px`;
        heart.style.top = `${y - 15}px`;
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 2000);
    }

    openBtn.addEventListener('click', () => {
        envelopeScreen.classList.add('hide');
        cardScreen.classList.add('show');
        
        playAudio();

        for(let i = 0; i < 15; i++) {
            setTimeout(() => {
                createHeart(window.innerWidth / 2 + (Math.random() - 0.5) * 200, window.innerHeight / 2 + (Math.random() - 0.5) * 200);
            }, i * 80);
        }
    });

    loveBtn.addEventListener('click', () => {
        const rect = loveBtn.getBoundingClientRect();
        for(let i = 0; i < 8; i++) {
            createHeart(rect.left + rect.width / 2 + (Math.random() - 0.5) * 60, rect.top);
        }
    });

    closeBtn.addEventListener('click', () => {
        cardScreen.classList.remove('show');
        envelopeScreen.classList.remove('hide');
        bgMusic.pause();
        isPlaying = false;
        musicBtn.innerText = "🎵";
    });

    // ---------------- Three.js ----------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2500);
    camera.position.set(0, 13, 52);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.8;
    cardScreen.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.04;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;

    function createGlowTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(0.3, 'rgba(255, 60, 190, 0.85)');
        gradient.addColorStop(0.7, 'rgba(210, 10, 130, 0.3)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvas);
    }

    const particleTexture = createGlowTexture();

    const starCount = 2200;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
        starPos[i * 3]     = (Math.random() - 0.5) * 400;
        starPos[i * 3 + 1] = (Math.random() - 0.5) * 300 + 13;
        starPos[i * 3 + 2] = (Math.random() - 0.5) * 400;
    }

    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
        size: 1.3,
        map: particleTexture,
        color: 0xffaae5,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const starMesh = new THREE.Points(starGeo, starMat);
    scene.add(starMesh);

    const lineCount = 2000;
    const lineGeo = new THREE.PlaneGeometry(0.35, 0.35);
    
    const lineMat = new THREE.ShaderMaterial({
        uniforms: { 
            uTime: { value: 0 },
            uTexture: { value: particleTexture }
        },
        vertexShader: `
            uniform float uTime;
            varying vec3 vColor;
            varying vec2 vUv;
            attribute vec3 aTargetPos;

            void main() {
                vUv = uv;
                vec3 pos = aTargetPos;

                pos.x += sin(uTime * 3.0 + pos.y) * 0.18;
                pos.z += cos(uTime * 3.0 + pos.y) * 0.18;

                float angle = uTime * 0.25;
                float c = cos(angle);
                float s = sin(angle);
                mat3 rotY = mat3(c, 0, s, 0, 1, 0, -s, 0, c);
                vec3 rotatedPos = rotY * pos;

                vColor = vec3(1.0, 0.2, 0.7) * 4.0;

                vec4 mvPosition = viewMatrix * vec4(rotatedPos, 1.0);
                mvPosition.xy += position.xy * 0.35;
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            uniform sampler2D uTexture;
            varying vec3 vColor;
            varying vec2 vUv;
            void main() {
                vec4 tex = texture2D(uTexture, vUv);
                gl_FragColor = vec4(vColor * tex.rgb, tex.a * 0.95);
            }
        `,
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    });

    const targetPosArray = new Float32Array(lineCount * 3);

    for (let i = 0; i < lineCount; i++) {
        const isLineTwo = i >= lineCount / 2;
        const progress = (i % (lineCount / 2)) / (lineCount / 2);
        const height = progress * 10.0 - 2.0;

        let lx = 0, lz = 0;
        if (!isLineTwo) {
            lx = -2.5 * Math.sin(progress * Math.PI * 0.5) + (progress * 3.5);
            lz = Math.sin(progress * Math.PI) * 0.5;
        } else {
            lx = 2.5 * Math.sin(progress * Math.PI * 0.5) - (progress * 3.5);
            lz = -Math.sin(progress * Math.PI) * 0.5;
        }

        targetPosArray[i * 3]     = lx;
        targetPosArray[i * 3 + 1] = height;
        targetPosArray[i * 3 + 2] = lz;
    }

    lineGeo.setAttribute('aTargetPos', new THREE.BufferAttribute(targetPosArray, 3));
    const lineMesh = new THREE.InstancedMesh(lineGeo, lineMat, lineCount);

    const dummy = new THREE.Object3D();
    for (let i = 0; i < lineCount; i++) {
        dummy.position.set(0, 0, 0);
        dummy.updateMatrix();
        lineMesh.setMatrixAt(i, dummy.matrix);
    }
    scene.add(lineMesh);

    const clock = new THREE.Clock();

    function animate() {
        const time = clock.getElapsedTime();
        lineMat.uniforms.uTime.value = time;

        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
  </html>
